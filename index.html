<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使命鑑定ナビ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #1A253A 0%, #3C5A99 100%); 
      --accent-gradient: linear-gradient(135deg, #D4AF37 0%, #b58900 100%); 
      --gold-accent: #D4AF37; 
      --app-bg: #FFFFFF;
      --text-main: #333333;
      --transition-base: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: '游明朝', 'YuMincho', serif;
      background: #F5F1E9;
      margin: 0; display: flex; justify-content: center; align-items: center;
      height: 100vh; width: 100vw; overflow: hidden;
    }

    .app-container {
      width: 100%; max-width: 500px; height: 98vh; background: var(--app-bg);
      display: flex; flex-direction: column; border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); overflow: hidden; position: relative;
    }

    header {
      background: var(--primary-gradient); color: #FFF; padding: 20px; 
      text-align: center; position: relative; z-index: 10;
    }
    
    /* 修正：数秘を右上へ配置 & 目出度い演出 */
    .result-badge {
      position: absolute; top: 10px; right: 15px;
      background: var(--accent-gradient);
      width: 70px; height: 70px; border-radius: 50%;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
      border: 2px solid #FFF;
      animation: popCongrats 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .result-badge.visible { display: flex; }
    .result-badge .num-val { font-size: 1.8rem; font-weight: bold; font-family: 'Playfair Display', serif; line-height: 1; }
    .result-badge .num-label { font-size: 0.6rem; font-weight: bold; }

    @keyframes popCongrats {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      70% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .calculator-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 5px; }
    .name-input {
      width: 80%; padding: 10px 18px; border: 2px solid #DDE2E5; border-radius: 30px;
      text-align: center; font-size: 1.1rem; font-family: 'Klee One', cursive; outline: none;
    }
    .calc-btn {
      background: var(--gold-accent); color: #0D1B2A; border: none;
      padding: 10px 25px; border-radius: 20px; font-weight: bold; cursor: pointer;
    }

    /* 修正：キーワード表示のスタイル */
    .keyword-info {
      margin-top: 10px; font-size: 0.8rem; text-align: left; width: 85%;
      background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; display: none;
    }
    .keyword-info.visible { display: block; }

    #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: #FAFCFD; }
    .message { max-width: 90%; padding: 14px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.6; animation: fadeIn 0.4s ease-out; }
    .user-message { align-self: flex-end; background: var(--primary-gradient); color: #FFF; border-bottom-right-radius: 4px; }
    .app-message { align-self: flex-start; background: #FFF; border: 1px solid #EEF2F5; border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }

    .input-area { display: flex; padding: 12px; border-top: 1px solid #EEF2F5; gap: 8px; background: #FFF; }
    #chat-input { flex: 1; padding: 12px 18px; border-radius: 25px; border: 1px solid #E5E8E8; outline: none; }
    #send-btn { background: var(--accent-gradient); color: #FFF; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="app-container">
    <header id="main-header">
      <h1 id="header-title" style="margin:0; font-size:1.2rem;"><i class="fas fa-gem"></i> 使命鑑定ナビ</h1>
      
      <div id="result-badge" class="result-badge">
        <span class="num-label">あなたの音</span>
        <span id="num-val" class="num-val"></span>
      </div>

      <div class="calculator-container" id="calc-area">
        <input type="text" id="name-input" class="name-input" placeholder="お名前をひらがなで">
        <button id="calc-btn" class="calc-btn"><i class="fas fa-sparkles"></i> 音を導き出す</button>
      </div>

      <div id="keyword-info" class="keyword-info">
        <div id="kw-mission" style="margin-bottom:5px;"></div>
        <div id="kw-ego"></div>
      </div>
    </header>
    
    <div id="chat-container">
      <div id="welcome-msg" class="message app-message">
        こんにちは。<br>あなたの「音」に刻まれた使命を解き明かし、魂が望む未来への道標をお渡しします。<br>まずはお名前をひらがなで入力してください。
      </div>
    </div>
    
    <div class="input-area">
      <input type="text" id="chat-input" placeholder="お悩みをご相談ください...">
      <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    const charValues = {'あ':18,'い':5,'う':19,'え':43,'お':40,'か':25,'き':29,'く':11,'け':35,'こ':16,'さ':28,'し':23,'す':21,'せ':36,'そ':30,'た':26,'ち':27,'つ':44,'て':9,'と':17,'な':14,'に':32,'ぬ':39,'ね':46,'の':20,'は':42,'ひ':1,'ふ':2,'へ':22,'ほ':47,'ま':6,'み':3,'む':13,'め':10,'も':33,'や':15,'ゆ':37,'よ':4,'ら':31,'り':8,'る':12,'れ':24,'ろ':34,'わ':7,'ん':48,'が':25,'ぎ':29,'ぐ':11,'げ':35,'ご':16,'ざ':28,'じ':23,'ず':21,'ぜ':36,'ぞ':30,'だ':26,'ぢ':27,'づ':44,'で':9,'ど':17,'ば':42,'び':1,'ぶ':2,'べ':22,'ぼ':47,'ぱ':42,'ぴ':1,'ぷ':2,'ぺ':22,'ぽ':47};
    const keywordsData = {
      1: { m: "本質・本物・根源", e: "迷走・保留・依頼心", d: "あなたは物事の核心を見抜き、新しい道を切り拓くリーダーの資質を持っています。" },
      2: { m: "整理・要約・適格", e: "雑・散漫・慢心", d: "周囲を調和させ、複雑な状況を整えることで、人々に安心を与える存在です。" },
      3: { m: "具現・学習・技術", e: "無気力・憔悴・逃避", d: "学んだことを形にする力が強く、地道な努力を成果へと変える才能があります。" },
      4: { m: "語彙力・経験・体験", e: "長話・孤独・停止", d: "豊かな言葉と経験を通じて、世界に希望を伝える旅人のような使命を持っています。" },
      5: { m: "音・文・響・芸", e: "噂・悪口・疑心", d: "自己を表現し、情報を広く伝えることで、多くの人の心に響きをもたらします。" },
      6: { m: "察知・提供・準備", e: "強欲・見返り・損得", d: "一歩先を察し、献身的に準備を整えることで、周囲に癒やしと豊かさを提供します。" },
      7: { m: "同調・保護・育成", e: "差別・批判・強気", d: "他者に寄り添い、育むことで、平和で穏やかな環境を作り出す保護者です。" },
      8: { m: "哲学・追求・美学", e: "利己・理屈・虚栄", d: "自身の美学を追求し、直感に従って行動することで、孤高の道を切り拓きます。" },
      9: { m: "意外・芸術・言葉", e: "怠惰・批判・執着", d: "常識にとらわれない発想と圧倒的な気力で、新しい価値を生み出す芸術家です。" }
    };

    const nameInput = document.getElementById('name-input');
    const calcBtn = document.getElementById('calc-btn');
    const chatContainer = document.getElementById('chat-container');
    const welcomeMsg = document.getElementById('welcome-msg');
    const resultBadge = document.getElementById('result-badge');
    const numVal = document.getElementById('num-val');
    const kwInfo = document.getElementById('keyword-info');
    const kwMission = document.getElementById('kw-mission');
    const kwEgo = document.getElementById('kw-ego');
    const calcArea = document.getElementById('calc-area');
    const headerTitle = document.getElementById('header-title');

    let currentNum = null;

    calcBtn.addEventListener('click', () => {
      const name = nameInput.value.replace(/[^ぁ-んが-ぼぱ-ぽ]/g, '');
      if (!name) return;
      
      let total = 0;
      for (let c of name) { total += charValues[c] || 0; }
      total = Math.abs(total);
      while (total >= 10) { total = total.toString().split('').map(Number).reduce((a,b)=>a+b, 0); }
      
      currentNum = total;
      const data = keywordsData[total];

      // 修正：初期案内文を削除
      if (welcomeMsg) welcomeMsg.remove();
      
      // 修正：右上に数秘を大きく表示（演出付き）
      numVal.innerText = total;
      resultBadge.classList.add('visible');
      
      // ヘッダーのコンパクト化とキーワード提示
      headerTitle.style.textAlign = 'left';
      calcArea.style.display = 'none';
      kwMission.innerHTML = `<span style="color:#8eb1ff; font-weight:bold;">【使命】</span> ${data.m}`;
      kwEgo.innerHTML = `<span style="color:#ffca28; font-weight:bold;">【エゴ】</span> ${data.e}`;
      kwInfo.classList.add('visible');

      // 鑑定結果メッセージ
      addMessage(`鑑定の結果、あなたの音は「${total}」と出ました。<br><br>${data.d}<br>この結果をふまえて、今のお悩みについてお話ししましょう。`, 'app');
    });

    function addMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}-message`;
      msgDiv.innerHTML = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    document.getElementById('send-btn').onclick = () => {
      const input = document.getElementById('chat-input');
      if (!input.value.trim() || !currentNum) return;
      addMessage(input.value, 'user');
      input.value = '';
      
      // 仮の返答（サーバー連携の言葉を排除）
      setTimeout(() => {
        addMessage(`あなたの「${currentNum}の音」の視点からお答えします。今の状況において大切にすべきなのは、エゴを抑え『${keywordsData[currentNum].m.split('・')[0]}』に立ち返ることかもしれません。`, 'app');
      }, 800);
    };
  </script>
</body>
</html>
