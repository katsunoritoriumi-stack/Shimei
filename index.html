<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使命鑑定ナビ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #1A253A 0%, #3C5A99 100%); 
      --accent-gradient: linear-gradient(135deg, #D4AF37 0%, #b58900 100%); 
      --gold-accent: #D4AF37; 
      --app-bg: #FFFFFF;
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: '游明朝', 'YuMincho', serif;
      background: #F5F1E9;
      margin: 0; display: flex; justify-content: center; align-items: center;
      height: 100vh; width: 100vw; overflow: hidden;
    }

    .app-container {
      width: 100%; max-width: 500px; height: 98vh; background: var(--app-bg);
      display: flex; flex-direction: column; border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); overflow: hidden; position: relative;
    }

    header {
      background: var(--primary-gradient); color: #FFF; padding: 25px 20px; 
      position: relative; z-index: 10;
    }
    
    #header-title { margin:0 0 10px 0; font-size:1.4rem; display: flex; align-items: center; gap: 8px; }

    .result-badge {
      position: absolute; 
      top: 45px; 
      right: 40px; 
      background: var(--accent-gradient);
      width: 120px; height: 120px; border-radius: 50%;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.9), inset 0 0 15px rgba(255,255,255,0.5);
      border: 4px solid #FFF;
      z-index: 30;
      opacity: 0;
    }
    .result-badge.visible { display: flex; }
    .result-badge .num-val { font-size: 4rem; font-weight: bold; font-family: 'Playfair Display', serif; line-height: 1; color: #FFF; text-shadow: 0 3px 6px rgba(0,0,0,0.3); }
    .result-badge .num-label { font-size: 0.8rem; font-weight: bold; color: #FFF; margin-bottom: -5px; letter-spacing: 0.1em;}

    .sparkle {
      position: absolute; background: #FFF; border-radius: 50%; pointer-events: none;
      box-shadow: 0 0 10px #D4AF37;
    }

    @keyframes particleFade {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    .calculator-container { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-top: 10px; }
    .name-input {
      width: 90%; padding: 12px 20px; border: 2px solid #DDE2E5; border-radius: 30px;
      text-align: center; font-size: 1.1rem; font-family: 'Klee One', cursive; outline: none;
    }
    .calc-btn {
      background: var(--gold-accent); color: #0D1B2A; border: none;
      padding: 12px 35px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 1rem;
    }

    .keyword-info {
      margin-top: 5px; font-size: 0.9rem; text-align: left; 
      width: 75%; 
      background: rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; display: none;
      position: relative; z-index: 10;
    }
    .keyword-info.visible { display: block; animation: fadeIn 0.5s ease-out; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: #FAFCFD; }
    .message { max-width: 90%; padding: 15px 20px; border-radius: 20px; font-size: 0.95rem; line-height: 1.6; animation: fadeIn 0.4s ease-out; }
    .app-message { align-self: flex-start; background: #FFF; border: 1px solid #EEF2F5; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .user-message { align-self: flex-end; background: var(--primary-gradient); color: #FFF; border-bottom-right-radius: 4px; }

    .typing-indicator { align-self: flex-start; display: flex; gap: 5px; padding: 12px 18px; background: #FFF; border: 1px solid #EEF2F5; border-radius: 20px; border-bottom-left-radius: 4px; }
    .typing-indicator span { width: 6px; height: 6px; background: #BDC3C7; border-radius: 50%; animation: bounce 1.4s infinite; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    .input-area { display: flex; padding: 15px; border-top: 1px solid #EEF2F5; gap: 10px; background: #FFF; }
    #chat-input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #E5E8E8; outline: none; }
    #send-btn { background: var(--accent-gradient); color: #FFF; border: none; border-radius: 50%; width: 48px; height: 48px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="app-container">
    <header id="main-header">
      <h1 id="header-title"><i class="fas fa-gem" style="color:var(--gold-accent);"></i> 使命鑑定ナビ</h1>
      
      <div id="result-badge" class="result-badge">
        <span class="num-label">あなたの音</span>
        <span id="num-val" class="num-val"></span>
        <div id="sparkle-container" style="position:absolute; width:100%; height:100%;"></div>
      </div>

      <div class="calculator-container" id="calc-area">
        <input type="text" id="name-input" class="name-input" placeholder="お名前をひらがなで入力">
        <button id="calc-btn" class="calc-btn"><i class="fas fa-sparkles"></i> 音を導き出す</button>
      </div>

      <div id="keyword-info" class="keyword-info">
        <div id="kw-mission" style="margin-bottom:10px;"></div>
        <div id="kw-ego"></div>
      </div>
    </header>
    
    <div id="chat-container">
      <div id="welcome-msg" class="message app-message">
        こんにちは。<br>あなたの「音」に刻まれた使命を解き明かし、魂が望む未来への道標をお渡しします。<br>まずはお名前をひらがなで入力し、「音を導き出す」ボタンを押してください。
      </div>
    </div>
    
    <div class="input-area">
      <input type="text" id="chat-input" placeholder="お悩みをご相談ください...">
      <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    const charValues = {'あ':18,'い':5,'う':19,'え':43,'お':40,'か':25,'き':29,'く':11,'け':35,'こ':16,'さ':28,'し':23,'す':21,'せ':36,'そ':30,'た':26,'ち':27,'つ':44,'て':9,'と':17,'な':14,'に':32,'ぬ':39,'ね':46,'の':20,'は':42,'ひ':1,'ふ':2,'へ':22,'ほ':47,'ま':6,'み':3,'む':13,'め':10,'も':33,'や':15,'ゆ':37,'よ':4,'ら':31,'り':8,'る':12,'れ':24,'ろ':34,'わ':7,'ん':48,'が':25,'ぎ':29,'ぐ':11,'げ':35,'ご':16,'ざ':28,'じ':23,'ず':21,'ぜ':36,'ぞ':30,'だ':26,'ぢ':27,'づ':44,'で':9,'ど':17,'ば':42,'び':1,'ぶ':2,'べ':22,'ぼ':47,'ぱ':42,'ぴ':1,'ぷ':2,'ぺ':22,'ぽ':47};
    const keywordsData = {
      1: { m: "本質・本物・根源", e: "迷走・保留・依頼心" },
      2: { m: "整理・要約・適格", e: "雑・散漫・慢心" },
      3: { m: "具現・学習・技術", e: "無気力・憔悴・逃避" },
      4: { m: "語彙力・経験・体験", e: "長話・孤独・停止" },
      5: { m: "音・文・響・芸", e: "噂・悪口・疑心" },
      6: { m: "察知・提供・準備", e: "強欲・見返り・損得" },
      7: { m: "同調・保護・育成", e: "差別・批判・強気" },
      8: { m: "哲学・追求・美学", e: "利己・理屈・虚栄" },
      9: { m: "意外・芸術・言葉", e: "怠惰・批判・執着" }
    };

    const nameInput = document.getElementById('name-input');
    const calcBtn = document.getElementById('calc-btn');
    const chatContainer = document.getElementById('chat-container');
    const welcomeMsg = document.getElementById('welcome-msg');
    const resultBadge = document.getElementById('result-badge');
    const numVal = document.getElementById('num-val');
    const sparkleContainer = document.getElementById('sparkle-container');
    const kwInfo = document.getElementById('keyword-info');
    const kwMission = document.getElementById('kw-mission');
    const kwEgo = document.getElementById('kw-ego');
    const calcArea = document.getElementById('calc-area');

    let currentNum = null;

    function createSparkles() {
      sparkleContainer.innerHTML = '';
      for (let i = 0; i < 40; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const size = Math.random() * 10 + 5;
        s.style.width = `${size}px`; s.style.height = `${size}px`;
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 120 + 60;
        s.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        s.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        s.style.animation = `particleFade 1s ease-out forwards`;
        s.style.left = '50%'; s.style.top = '50%';
        sparkleContainer.appendChild(s);
      }
    }

    calcBtn.addEventListener('click', () => {
      const name = nameInput.value.replace(/[^ぁ-んが-ぼぱ-ぽ]/g, '');
      if (!name) return;
      
      let total = 0;
      for (let c of name) { total += charValues[c] || 0; }
      total = Math.abs(total);
      while (total >= 10) { total = total.toString().split('').map(Number).reduce((a,b)=>a+b, 0); }
      
      currentNum = total;
      if (welcomeMsg) welcomeMsg.remove();
      numVal.innerText = total;
      resultBadge.classList.add('visible');
      
      resultBadge.animate([
        { transform: 'translate(50px, -50px) scale(0)', opacity: 0 },
        { transform: 'translate(0, 0) scale(1.2)', opacity: 1, offset: 0.8 },
        { transform: 'translate(0, 0) scale(1)', opacity: 1 }
      ], { duration: 700, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)', fill: 'forwards' });
      
      setTimeout(createSparkles, 200);

      calcArea.style.display = 'none';
      kwMission.innerHTML = `<span style="color:#8eb1ff; font-weight:bold;">【使命】</span> ${keywordsData[total].m}`;
      kwEgo.innerHTML = `<span style="color:#ffca28; font-weight:bold;">【エゴ】</span> ${keywordsData[total].e}`;
      kwInfo.classList.add('visible');

      addMessage(`鑑定が完了しました。あなたの「音」に刻まれた数字は「${total}」です。<br>この数字が示す使命をふまえ、あなたのお悩みについて深く読み解いていきましょう。具体的に気になっていることはありますか？`, 'app');
    });

    async function generateAIResponse(userText) {
      const indicator = document.createElement('div');
      indicator.className = 'typing-indicator';
      indicator.innerHTML = '<span></span><span></span><span></span>';
      chatContainer.appendChild(indicator);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch('/api/gemini', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message: userText, 
            number: currentNum, 
            context: {
              m: keywordsData[currentNum].m,
              e: keywordsData[currentNum].e
            }
          })
        });

        const data = await response.json();
        
        // 【重要】もし返答（reply）が空っぽだった場合の安全装置
        if (!data || !data.reply) {
          throw new Error(`サーバーからの返信が空でした。（生データ: ${JSON.stringify(data)}）`);
        }

        chatContainer.removeChild(indicator);
        addMessage(data.reply, 'app');

      } catch (e) {
        if (indicator.parentNode) chatContainer.removeChild(indicator);
        addMessage(`システム通信エラー: ${e.message}`, 'app');
      }
    }

    function addMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}-message`;
      msgDiv.innerHTML = text.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight; 
    }

    document.getElementById('send-btn').onclick = () => {
      const input = document.getElementById('chat-input');
      if (!input.value.trim() || !currentNum) return;
      addMessage(input.value, 'user');
      const text = input.value;
      input.value = '';
      generateAIResponse(text);
    };

    document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('send-btn').click(); });
  </script>
</body>
</html>
