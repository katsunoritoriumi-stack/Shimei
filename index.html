<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使命鑑定ナビ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #1A253A 0%, #3C5A99 100%); 
      --accent-gradient: linear-gradient(135deg, #D4AF37 0%, #b58900 100%); 
      --gold-accent: #D4AF37; 
      --app-bg: #FFFFFF;
      --transition-base: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: '游明朝', 'YuMincho', serif;
      background: #F5F1E9;
      margin: 0; display: flex; justify-content: center; align-items: center;
      height: 100vh; width: 100vw; overflow: hidden;
    }

    .app-container {
      width: 100%; max-width: 500px; height: 98vh; background: var(--app-bg);
      display: flex; flex-direction: column; border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); overflow: hidden; position: relative;
    }

    header {
      background: var(--primary-gradient); color: #FFF; padding: 20px; 
      position: relative; z-index: 10;
    }
    
    #header-title { margin:0; font-size:1.3rem; display: flex; align-items: center; gap: 8px; }

    /* ★修正③：数秘バッジをさらに大きくし、青い箱に被せる */
    .result-badge {
      position: absolute; top: 15px; right: -10px; /* 少し右にはみ出させる */
      background: var(--accent-gradient);
      width: 100px; height: 100px; border-radius: 50%;
      display: none; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.8);
      border: 3px solid #FFF;
      z-index: 20; /* 最前面に */
      opacity: 0;
    }
    .result-badge.visible { display: flex; }
    .result-badge .num-val { font-size: 3rem; font-weight: bold; font-family: 'Playfair Display', serif; line-height: 1; color: #FFF; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    .result-badge .num-label { font-size: 0.7rem; font-weight: bold; color: #FFF; margin-bottom: -5px;}

    /* ★修正②：スパーク（粒子）エフェクト */
    .sparkle {
      position: absolute; background: radial-gradient(circle, #FFF 10%, rgba(255,255,255,0) 70%);
      border-radius: 50%; pointer-events: none; opacity: 0;
    }

    @keyframes particleFade {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    .calculator-container { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 15px; }
    .name-input {
      width: 85%; padding: 12px 18px; border: 2px solid #DDE2E5; border-radius: 30px;
      text-align: center; font-size: 1.1rem; font-family: 'Klee One', cursive; outline: none; transition: var(--transition-base);
    }
    .name-input:focus { border-color: var(--gold-accent); box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
    .calc-btn {
      background: var(--gold-accent); color: #0D1B2A; border: none;
      padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; transition: var(--transition-base);
      font-size: 1rem;
    }
    .calc-btn:hover { background: #FFF; color: var(--gold-accent); transform: translateY(-2px); }

    .keyword-info {
      margin-top: 15px; font-size: 0.85rem; text-align: left; width: 100%;
      background: rgba(255,255,255,0.08); padding: 15px; border-radius: 12px; display: none;
      position: relative; z-index: 10; /* 数字より下に配置 */
    }
    .keyword-info.visible { display: block; animation: fadeIn 0.5s ease-out; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; background: #FAFCFD; }
    .message { max-width: 90%; padding: 15px 20px; border-radius: 20px; font-size: 0.95rem; line-height: 1.6; animation: fadeIn 0.4s ease-out; word-wrap: break-word; }
    .user-message { align-self: flex-end; background: var(--primary-gradient); color: #FFF; border-bottom-right-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
    .app-message { align-self: flex-start; background: #FFF; border: 1px solid #EEF2F5; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }

    .input-area { display: flex; padding: 15px; border-top: 1px solid #EEF2F5; gap: 10px; background: #FFF; }
    #chat-input { flex: 1; padding: 12px 20px; border-radius: 25px; border: 1px solid #E5E8E8; outline: none; transition: var(--transition-base); }
    #chat-input:focus { border-color: var(--gold-accent); }
    #send-btn { background: var(--accent-gradient); color: #FFF; border: none; border-radius: 50%; width: 48px; height: 48px; cursor: pointer; transition: var(--transition-base); display: flex; align-items: center; justify-content: center; }
    #send-btn:hover { transform: scale(1.05); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="app-container">
    <header id="main-header">
      <h1 id="header-title"><i class="fas fa-gem" style="color:var(--gold-accent);"></i> 使命鑑定ナビ</h1>
      
      <div id="result-badge" class="result-badge">
        <span class="num-label">あなたの音</span>
        <span id="num-val" class="num-val"></span>
        <div id="sparkle-container" style="position:absolute; width:100%; height:100%;"></div>
      </div>

      <div class="calculator-container" id="calc-area">
        <input type="text" id="name-input" class="name-input" placeholder="お名前をひらがなで入力">
        <button id="calc-btn" class="calc-btn"><i class="fas fa-sparkles"></i> 音を導き出す</button>
      </div>

      <div id="keyword-info" class="keyword-info">
        <div id="kw-mission" style="margin-bottom:8px;"></div>
        <div id="kw-ego"></div>
      </div>
    </header>
    
    <div id="chat-container">
      <div id="welcome-msg" class="message app-message">
        こんにちは。<br>あなたの「音」に刻まれた使命を解き明かし、魂が望む未来への道標をお渡しします。<br>まずはお名前をひらがなで入力し、「音を導き出す」ボタンを押してください。
      </div>
    </div>
    
    <div class="input-area">
      <input type="text" id="chat-input" placeholder="お悩みをご相談ください...">
      <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>

  <script>
    const charValues = {'あ':18,'い':5,'う':19,'え':43,'お':40,'か':25,'き':29,'く':11,'け':35,'こ':16,'さ':28,'し':23,'す':21,'せ':36,'そ':30,'た':26,'ち':27,'つ':44,'て':9,'と':17,'な':14,'に':32,'ぬ':39,'ね':46,'の':20,'は':42,'ひ':1,'ふ':2,'へ':22,'ほ':47,'ま':6,'み':3,'む':13,'め':10,'も':33,'や':15,'ゆ':37,'よ':4,'ら':31,'り':8,'る':12,'れ':24,'ろ':34,'わ':7,'ん':48,'が':25,'ぎ':29,'ぐ':11,'げ':35,'ご':16,'ざ':28,'じ':23,'ず':21,'ぜ':36,'ぞ':30,'だ':26,'ぢ':27,'づ':44,'で':9,'ど':17,'ば':42,'び':1,'ぶ':2,'べ':22,'ぼ':47,'ぱ':42,'ぴ':1,'ぷ':2,'ぺ':22,'ぽ':47};
    const keywordsData = {
      1: { m: "本質・本物・根源", e: "迷走・保留・依頼心", d: "あなたは物事の核心を見抜き、新しい道を切り拓くリーダーの資質を持っています。嘘偽りのない「本物」を追求することが使命です。" },
      2: { m: "整理・要約・適格", e: "雑・散漫・慢心", d: "周囲を調和させ、複雑な状況を整えることで、人々に安心と明確な指針を与える存在です。細やかな気配りが鍵となります。" },
      3: { m: "具現・学習・技術", e: "無気力・憔悴・逃避", d: "学んだことを形にする力が強く、地道な努力を成果へと変える才能があります。自らの技術を磨き、世に示すことが大切です。" },
      4: { m: "語彙力・経験・体験", e: "長話・孤独・停止", d: "豊かな言葉と経験を通じて、世界に希望を伝える旅人のような使命を持っています。多くの体験を自らの糧としてください。" },
      5: { m: "音・文・響・芸", e: "噂・悪口・疑心", d: "自己を表現し、情報を広く伝えることで、多くの人の心に「響き」をもたらします。表現者としての道を歩んでください。" },
      6: { m: "察知・提供・準備", e: "強欲・見返り・損得", d: "一歩先を察し、献身的に準備を整えることで、周囲に癒やしと豊かさを提供します。無償の愛を実践することがテーマです。" },
      7: { m: "同調・保護・育成", e: "差別・批判・強気", d: "他者に寄り添い、育むことで、平和で穏やかな環境を作り出す保護者のような存在です。沈着冷静な判断が周囲を救います。" },
      8: { m: "哲学・追求・美学", e: "利己・理屈・虚栄", d: "自身の美学を追求し、直感に従って行動することで、孤高の道を切り拓きます。高い志を持ち続けることが使命です。" },
      9: { m: "意外・芸術・言葉", e: "怠惰・批判・執着", d: "常識にとらわれない発想と圧倒的な気力で、新しい価値や芸術を生み出します。自らの内なるエネルギーを爆発させてください。" }
    };

    const nameInput = document.getElementById('name-input');
    const calcBtn = document.getElementById('calc-btn');
    const chatContainer = document.getElementById('chat-container');
    const welcomeMsg = document.getElementById('welcome-msg');
    const resultBadge = document.getElementById('result-badge');
    const numVal = document.getElementById('num-val');
    const sparkleContainer = document.getElementById('sparkle-container');
    const kwInfo = document.getElementById('keyword-info');
    const kwMission = document.getElementById('kw-mission');
    const kwEgo = document.getElementById('kw-ego');
    const calcArea = document.getElementById('calc-area');
    const headerTitle = document.getElementById('header-title');

    let currentNum = null;

    // ★修正②：スパーク（粒子）を生成する関数
    function createSparkles() {
      sparkleContainer.innerHTML = ''; // クリア
      for (let i = 0; i < 30; i++) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        
        // ランダムな大きさと位置
        const size = Math.random() * 8 + 4; // 4px〜12px
        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;
        
        // 中心からの飛び散る方向と距離をランダムに設定
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 80 + 50; // 50px〜130px飛び散る
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        
        sparkle.style.setProperty('--dx', `${dx}px`);
        sparkle.style.setProperty('--dy', `${dy}px`);
        
        // アニメーションの設定（遅延をランダムにしてバラけさせる）
        sparkle.style.animation = `particleFade 0.8s ease-out ${Math.random() * 0.2}s forwards`;
        
        // バッジの中心に配置
        sparkle.style.left = '50%';
        sparkle.style.top = '50%';
        sparkle.style.transform = 'translate(-50%, -50%)';

        sparkleContainer.appendChild(sparkle);
      }
    }

    // ★修正②、③：出現アニメーションの定義
    const badgeAnimation = [
      { transform: 'translate(30px, -30px) scale(0) rotate(-45deg)', opacity: 0 },
      { transform: 'translate(0, 0) scale(1.1) rotate(10deg)', opacity: 1, offset: 0.7 },
      { transform: 'translate(0, 0) scale(1) rotate(0deg)', opacity: 1 }
    ];

    calcBtn.addEventListener('click', () => {
      const name = nameInput.value.replace(/[^ぁ-んが-ぼぱ-ぽ]/g, '');
      if (!name) return;
      
      let total = 0;
      for (let c of name) { total += charValues[c] || 0; }
      total = Math.abs(total);
      while (total >= 10) { total = total.toString().split('').map(Number).reduce((a,b)=>a+b, 0); }
      
      currentNum = total;
      const data = keywordsData[total];

      if (welcomeMsg) welcomeMsg.remove();
      
      numVal.innerText = total;
      resultBadge.classList.add('visible');
      
      // ★修正②：出現アニメーションとスパークを実行
      resultBadge.animate(badgeAnimation, { duration: 600, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)', fill: 'forwards' });
      setTimeout(createSparkles, 100); // 少し遅らせてスパーク

      headerTitle.style.justifyContent = 'flex-start';
      calcArea.style.display = 'none';
      kwMission.innerHTML = `<span style="color:#8eb1ff; font-weight:bold;">【使命】</span> ${data.m}`;
      kwEgo.innerHTML = `<span style="color:#ffca28; font-weight:bold;">【エゴ】</span> ${data.e}`;
      kwInfo.classList.add('visible');

      // ★修正①：鑑定結果メッセージを少し丁寧に
      setTimeout(() => {
        addMessage(`鑑定が完了しました。あなたの「音」に刻まれた数字は「${total}」です。<br><br>${data.d}<br>この数字が示す使命と、あなたが今抱えているお悩み。その重なりを一緒に紐解いていきましょう。何か具体的に気になっていることはありますか？`, 'app');
      }, 1000);
    });

    function addMessage(text, type) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${type}-message`;
      msgDiv.innerHTML = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    document.getElementById('send-btn').onclick = () => {
      const input = document.getElementById('chat-input');
      if (!input.value.trim() || !currentNum) return;
      addMessage(input.value, 'user');
      input.value = '';
      
      // 仮の返答
      setTimeout(() => {
        addMessage(`あなたの中にある「${currentNum}の音」は、その状況に対してエゴである『${keywordsData[currentNum].e.split('・')[0]}』を手放し、使命である『${keywordsData[currentNum].m.split('・')[0]}』の意識を持つことを促しているようです。<br><br>より具体的なアドバイスをするには、AIとの連携が必要ですが、今のデモモードではここまでの回答となります。`, 'app');
      }, 1200);
    };

    nameInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') calcBtn.click(); });
    document.getElementById('chat-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('send-btn').click(); });
  </script>
</body>
</html>
